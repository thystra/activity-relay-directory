name: Debian Package

on:
  push:
  pull_request:

jobs:
  debian:
    name: Debian package validation
    runs-on: forgejo-pilot
    steps:
      - uses: https://data.forgejo.org/actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up exact Go 1.26.5
        uses: https://data.forgejo.org/actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.26.5"

      - name: Install Debian packaging tools
        run: |
          set -Eeuo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends             debhelper fakeroot lintian
          rm -rf /var/lib/apt/lists/*

      - name: Validate source and build package artifacts
        run: |
          set -Eeuo pipefail
          export RELEASE_COMMIT="$(git rev-parse HEAD)"
          export RELEASE_TREE="$(git rev-parse 'HEAD^{tree}')"
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race -count=1 ./...
          scripts/release/build-debian-artifacts.sh "$RUNNER_TEMP/activity-relay-directory-package"

      - name: Verify public checksums
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/activity-relay-directory-package/public"
          sha256sum -c SHA256SUMS
