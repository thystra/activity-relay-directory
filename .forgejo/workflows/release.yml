name: Canonical Release Candidate Artifacts

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact reviewed commit to build
        required: true
        type: string
      version:
        description: Candidate application version
        required: true
        default: "0.1.0-rc1"
        type: string
      confirm:
        description: Type BUILD 0.1.0-rc1
        required: true
        type: string

jobs:
  canonical:
    name: Canonical 0.1.0-rc1 artifact set
    runs-on: forgejo-build
    steps:
      - uses: https://data.forgejo.org/actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: "false"

      - name: Require exact reviewed release input
        run: |
          set -Eeuo pipefail
          test "${{ inputs.version }}" = "0.1.0-rc1"
          test "${{ inputs.confirm }}" = "BUILD 0.1.0-rc1"
          test "$(git rev-parse HEAD)" = "${{ inputs.expected_commit }}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Set up exact Go 1.26.5
        uses: https://data.forgejo.org/actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.26.5"

      - name: Install Debian packaging tools
        run: |
          set -Eeuo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            debhelper fakeroot lintian
          rm -rf /var/lib/apt/lists/*

      - name: Release validation
        run: |
          set -Eeuo pipefail
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -count=1 ./...
          go test -race -count=1 ./...

      - name: Build canonical Debian, binary, SBOM, and metadata bytes once
        run: |
          set -Eeuo pipefail
          export RELEASE_COMMIT="$(git rev-parse HEAD)"
          export RELEASE_TREE="$(git rev-parse 'HEAD^{tree}')"
          scripts/release/build-debian-artifacts.sh "$RUNNER_TEMP/canonical-release"
          cd "$RUNNER_TEMP/canonical-release/public"
          sha256sum -c SHA256SUMS
          test "$(./activity-relay-directory_0.1.0-rc1_linux_amd64 --version)" = "0.1.0-rc1"

      - name: Set up Buildx
        uses: https://data.forgejo.org/docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Build canonical Docker image archive once
        uses: https://data.forgejo.org/docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          platforms: linux/amd64
          push: "false"
          provenance: "false"
          tags: activity-relay-directory:0.1.0-rc1
          build-args: |
            VERSION=0.1.0-rc1
          outputs: type=docker,dest=${{ runner.temp }}/canonical-release/public/activity-relay-directory_0.1.0-rc1_linux_amd64.docker.tar

      - name: Finalize one checksummed canonical artifact set
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/canonical-release/public"
          test -s activity-relay-directory_0.1.0-rc1_linux_amd64.docker.tar
          {
            echo "container_format=docker-archive"
            echo "container_image=activity-relay-directory:0.1.0-rc1"
            echo "container_platform=linux/amd64"
            echo "container_archive=activity-relay-directory_0.1.0-rc1_linux_amd64.docker.tar"
          } >> BUILD-METADATA.txt
          sha256sum \
            activity-relay-directory_0.1.0-rc1-1_amd64.deb \
            activity-relay-directory_0.1.0-rc1_amd64.cdx.json \
            activity-relay-directory_0.1.0-rc1_linux_amd64 \
            BUILD-METADATA.txt \
            activity-relay-directory_0.1.0-rc1_linux_amd64.docker.tar \
            > SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 5
          sha256sum -c SHA256SUMS

      - name: Upload canonical candidate artifact set
        uses: https://code.forgejo.org/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        with:
          name: activity-relay-directory-0.1.0-rc1-canonical-${{ inputs.expected_commit }}
          path: $RUNNER_TEMP/canonical-release/
          if-no-files-found: error
          retention-days: 30
