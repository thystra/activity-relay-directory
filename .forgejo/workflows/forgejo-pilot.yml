name: Forgejo pilot smoke

on:
  workflow_dispatch:

jobs:
  pilot:
    name: Repository-scoped runner smoke test
    runs-on: forgejo-pilot
    timeout-minutes: 10

    steps:
      - name: Verify Forgejo runner context
        shell: bash
        run: |
          set -euo pipefail

          test "${CI:-}" = "true"
          test "${FORGEJO_ACTIONS:-}" = "true"
          test "${FORGEJO_SERVER_URL:-}" = "https://forgejo.argentwolf.org"
          test "${FORGEJO_REPOSITORY:-}" = "alan/activity-relay-directory"

          echo "CI=$CI"
          echo "FORGEJO_ACTIONS=$FORGEJO_ACTIONS"
          echo "FORGEJO_SERVER_URL=$FORGEJO_SERVER_URL"
          echo "FORGEJO_REPOSITORY=$FORGEJO_REPOSITORY"
          echo "FORGEJO_RUN_ID=$FORGEJO_RUN_ID"

          uname -a
          id
          node --version
          git --version

      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Verify checkout and container isolation
        shell: bash
        run: |
          set -euo pipefail

          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$FORGEJO_SHA"
          test -z "$(git status --porcelain)"

          # The pilot runner deliberately does not expose the host Docker socket.
          test ! -S /var/run/docker.sock

          echo "checkout_sha=$actual_sha"
          echo "docker_socket_exposed=NO"
          git log -1 --oneline --decorate
